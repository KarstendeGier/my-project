<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Fotogalerij</title>
</head>

<body id="top">

    <header>
        <h1>Fotogalerij</h1>
    </header>

    <main>

        <!-- MINIATUREN -->
        <section>
            <h2>Overzicht</h2>

            <a href="#foto1">
                <img src="images/foto1-klein.jpg"
                     alt="Miniatuur van een zonsondergang boven zee"
                     width="300">
            </a>

            <a href="/grote-fotos.html">
                <img src="images/foto2-klein.jpg"
                     alt="Miniatuur van een bos in de herfst"
                     width="300">
            </a>

            <a href="#foto3">
                <img src="images/foto3-klein.jpg"
                     alt="Miniatuur van een berglandschap met sneeuw"
                     width="300">
            </a>

        </section>

        <hr>

        <!-- GROTE FOTO'S -->
        <section>

            <figure id="foto1">
                <h2>Foto 1</h2>
                <img src="images/foto1-groot.jpg"
                     alt="Zonsondergang boven zee"
                     width="800">
                <figcaption>Zonsondergang boven zee</figcaption>
                <p><a href="#top">Terug naar boven</a></p>
            </figure>

            <figure id="foto2">
                <h2>Foto 2</h2>
                <img src="images/foto2-groot.jpg"
                     alt="Bos in de herfst met vallende bladeren"
                     width="800">
                <figcaption>Herfstbos</figcaption>
                <p><a href="#top">Terug naar boven</a></p>
            </figure>

            <figure id="foto3">
                <h2>Foto 3</h2>
                <img src="images/foto3-groot.jpg"
                     alt="Bergen met sneeuwtoppen onder blauwe lucht"
                     width="800">
                <figcaption>Berglandschap met sneeuw</figcaption>
                <p><a href="#top">Terug naar boven</a></p>
            </figure>

        </section>

    </main>

    <footer>
        <p>Gemaakt door: jouw naam</p>
    </footer>

</body>
</html>
