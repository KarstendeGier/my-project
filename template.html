<form>
    <p>
        <label>Voornaam:
            <input name="voornaam" type="text" autofocus>
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>IBAN:
            <input name="IBAN" type="text" minlength="18" maxlength="18">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>Postcode: <small>1234 AB</small>
            <input name="postcode" pattern="[0-9]{4}\s?[a-zA-Z]{2}" title="Een postcode bestaat uit 4 cijfers en 2 letters.">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>


<form>
    <p>
        <label>Voornaam: 
            <input name="voornaam" type="text" autocomplete="given-name">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>Achternaam: 
            <input name="achternaam" type="text" autocomplete="family-name">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>De tafel van 6: 
            <input name="tafels=" type="number" value="0" step="6">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>waarde: 
            <input name="range" type="range" min="-100" max="100" step="10">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

<form>
    <p>
        <label>Kies een kleur: 
            <input name="kleur" type="color" value="#ff0000">
        </label>
    </p>
    <button type="submit">Verzend</button>

</form>

</body>
</html>
